name: Translate README to English

on:
  push:
    branches: [ main ]
    paths:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install deep-translator

      - name: Run translation script
        run: python scripts/translate.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-translate README to English"
          branch: auto/translate-readme-en
          title: "Auto-translate README to English"
          body: "This PR updates `docs/README.en.md` based on the latest `README.md`."
          base: main
          add-paths: docs/README.en.md