name: Translate README to English

on:
  push:
    branches: [ main ]
    paths:
      - "README.md" # 仅在中文 README 变更时触发
  workflow_dispatch: # 也可以手动触发测试

permissions:
  contents: write
  pull-requests: write
  models: read # ai-translate-action 使用 GitHub Models 所需权限

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Translate README
        id: translate
        uses: FidelusAleksander/ai-translate-action@v1
        with:
          text-file: "README.md"
          target-language: "English"
          custom-instructions: "Keep technical terms in English. Do not translate code blocks."

      - name: Save translated file
        run: |
          mkdir -p docs
          echo "$TRANSLATED_TEXT" > docs/README.en.md
        env:
          TRANSLATED_TEXT: ${{ steps.translate.outputs.translated-text }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-translate README to English"
          branch: auto/translate-readme-en
          title: "Auto-translate README to English"
          body: "This PR updates `docs/README.en.md` based on the latest `README.md`."
          base: main
          add-paths: docs/README.en.md