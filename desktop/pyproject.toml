[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdesk"
version = "1.0.0"
description = "Expose local files, shell, Python and stdio MCP servers to a browser agent."
requires-python = ">=3.9"
dependencies = ["rich>=13.7", "websockets>=13.0"]

[project.scripts]
agentdesk = "agentdesk.__main__:main"

[tool.setuptools.packages.find]
include = ["agentdesk*"]
